
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Você saiu da sua conta | Conecta+</title>

    <link rel="stylesheet" href="../static/css/logoff.css">
</head>

<body>
    <main class="page">

        <div class="blob blob-left"></div>
        <div class="blob blob-right"></div>
        <div class="blob blob-bottom"></div>

        <section class="logout-card">

            <a href="index.html" class="brand">
                <img
                    src="../static/images/conecta-logo.png"
                    alt="Símbolo do Conecta+"
                    class="logo-icon"
                >
                <span class="brand-name">Conecta<span>+</span></span>
            </a>


            <!-- Ilustração de saída -->
            <div class="logout-illustration">

                <div class="illustration-glow"></div>

                <div class="door-icon">
                    <svg viewBox="0 0 100 100" fill="none">
                        <path
                            d="M47 18H29C24 18 21 22 21 27V73C21 78 24 82 29 82H47"
                            stroke="currentColor"
                            stroke-width="7"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />

                        <path
                            d="M51 50H82M70 38L82 50L70 62"
                            stroke="currentColor"
                            stroke-width="8"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />
                    </svg>
                </div>

                <div class="check-badge">
                    <svg viewBox="0 0 32 32" fill="none">
                        <path
                            d="M7 16.5L13 22L25 10"
                            stroke="white"
                            stroke-width="4"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />
                    </svg>
                </div>

                <span class="spark spark-one"></span>
                <span class="spark spark-two"></span>
                <span class="spark spark-three"></span>

            </div>

            <!-- Mensagem de logoff -->
            <h1>Você saiu da sua conta!</h1>

            <p class="message">
                Obrigado por fazer parte da nossa comunidade.
                <br class="desktop-break">
                Continue aprendendo, evoluindo e conquistando!
            </p>

            <!-- Botão para voltar ao início -->
            <a href="landingpage.html" class="home-button">
                Voltar para o início
                <span aria-hidden="true">→</span>
            </a>

        </section>
    </main>
</body>
</html>
