<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta | Conecta+</title>
  <link rel="stylesheet" href="/empregeek/static/css/Register-System.css">
</head>
<body>
  <main class="auth-card">
    <section class="auth-main">
      <header class="topline">
        <a class="brand" href="login.html" aria-label="Conecta+, página inicial"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span>Conecta+</a>
        <a class="back-link" href="login.html">← Voltar para o login</a>
      </header>
      <div class="form-wrap">
        <h1>Crie sua conta</h1>
        <p class="intro">É rápido e fácil! Preencha os dados abaixo para começar.</p>
        <form action="login.html" method="get">
          <div class="field"><label for="nome">Nome completo</label><input id="nome" name="nome" type="text" placeholder="Digite seu nome completo" autocomplete="name" required></div>
          <div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" placeholder="Digite seu e-mail" autocomplete="email" required></div>
          <div class="field"><label for="senha">Senha</label><input id="senha" name="senha" type="password" placeholder="Crie uma senha" autocomplete="new-password" required></div>
          <button class="button" type="submit">Cadastrar</button>
        </form>
      </div>
    </section>
    <aside class="illustration">
      <div class="quote"><span class="doodle">♧</span>Juntos por mais oportunidades!<span class="doodle" style="margin-top:14px;margin-bottom:0;">〰</span></div>
    </aside>
  </main>
</body>
</html>
