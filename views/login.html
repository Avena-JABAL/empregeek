<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar | Conecta+</title>
  <link rel="stylesheet" href="/empregeek/static/css/Register-System.css">
</head>
<body>
  <main class="auth-card">
    <section class="auth-main">
      <header class="topline">
        <a class="brand" href="login.html" aria-label="Conecta+, página inicial"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span>Conecta+</a>
        <span class="top-note">Não tem uma conta? <a href="cadastro.html">Cadastre-se</a></span>
      </header>
      <div class="form-wrap">
        <h1>Olá de novo!</h1>
        <p class="intro">Entre na sua conta e continue sua jornada com a gente.</p>
        <form action="#" method="get">
          <div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" placeholder="Digite seu e-mail" autocomplete="email" required></div>
          <div class="field"><label for="senha">Senha</label><input id="senha" name="senha" type="password" placeholder="Digite sua senha" autocomplete="current-password" required></div>
          <div class="form-options">
            <label class="remember"><input type="checkbox" name="lembrar"> Lembrar de mim</label>
            <a href="recuperar-senha.html">Esqueci minha senha</a>
          </div>
          <button class="button" type="submit">Entrar</button>
        </form>
      </div>
    </section>
    <aside class="illustration">
      <div class="quote"><span class="doodle">✧</span>Grandes conquistas começam com pequenos passos!</div>
    </aside>
  </main>
</body>
</html>
