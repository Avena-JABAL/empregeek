<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar senha | Conecta+</title>
  <link rel="stylesheet" href="/empregeek/static/css/Register-System.css">
</head>
<body>
  <main class="auth-card recovery">
    <section class="auth-main">
      <header class="topline">
        <a class="brand" href="login.html" aria-label="Conecta+, página inicial"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span>Conecta+</a>
        <a class="back-link" href="login.html">← Voltar para o login</a>
      </header>
      <div class="form-wrap">
        <h1>Recuperar senha</h1>
        <p class="intro">Digite seu e-mail e enviaremos um link para você redefinir sua senha.</p>
        <form action="login.html" method="get">
          <div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" placeholder="Digite seu e-mail" autocomplete="email" required></div>
          <button class="button" type="submit">Enviar link</button>
        </form>
      </div>
    </section>
    <aside class="illustration">
      <div class="quote"><div class="envelope" aria-hidden="true">✉</div>Não se preocupe! Vamos te ajudar a recuperar o acesso à sua conta.</div>
    </aside>
  </main>
</body>
</html>
